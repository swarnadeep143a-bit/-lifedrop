v><strong>One</strong><span>Community, one shared purpose</span></div><div><strong>Every</strong><span>Drop can make a difference</span></div></div></div><section class="section"><div class="shell"><div class="section-title"><div class="eyebrow">HOW IT WORKS</div><h2>Three steps. One powerful impact.</h2><p>Simple tools to help donors and people seeking blood find the right next step.</p></div><div class="grid three"><article class="tile"><div class="step">01</div><h3>Register as a donor</h3><p>Share your blood group, city and contact preferences for review.</p></article><article class="tile"><div class="step">02</div><h3>Search locally</h3><p>Filter the donor directory by blood group and location.</p></article><article class="tile"><div class="step">03</div><h3>Connect responsibly</h3><p>Coordinate with consent and follow your hospital's guidance.</p></article></div></div></section><section class="section tint"><div class="shell"><div class="section-title"><div class="eyebrow">TAKE THE NEXT STEP</div><h2>Be there when someone needs you.</h2><p>Whether you're here to help or looking for help, LifeDrop makes the next step clearer.</p></div><div class="grid two"><article class="tile"><div class="iconbox">♡</div><h3>I want to donate</h3><p>Register your interest and let the LifeDrop team review your application.</p><p style="margin-top:20px"><a class="btn primary" href="#become-donor.html">Register as donor</a></p></article><article class="tile"><div class="iconbox">＋</div><h3>I need blood</h3><p>Submit the details of a blood request and keep its reference ID handy.</p><p style="margin-top:20px"><a class="btn secondary" href="#request-blood.html">Request blood</a></p></article></div></div></section></main><footer class="footer"><div class="shell"><div class="footgrid"><div><a class="brand" style="color:white" href="#index.html">LifeDrop</a><p>Every Drop Can Save a Life. Connecting people through the spirit of giving.</p></div><div><h3>Explore</h3><a href="#find-donors.html">Find donors</a><a href="#become-donor.html">Become a donor</a><a href="#request-blood.html">Request blood</a></div><div><h3>Information</h3><a href="#about.html">About LifeDrop</a><a href="#about.html#safety">Safety & privacy</a><a href="#about.html#faq">FAQs</a></div><div><h3>Your account</h3><a href="#login.html">Login</a><a href="#signup.html">Create account</a><a href="#dashboard.html">My dashboard</a><a href="#admin.html">Demo admin review</a></div></div><div class="copyright">Prototype with sample/local browser data. Not a medical or emergency service. For urgent needs, contact the hospital or licensed blood bank.</div></div></footer><div class="assist"><div class="assistant-box hidden" id="chatbox"><b>LifeDrop assistant</b><p>I can explain how to use the platform. I cannot provide medical advice or determine compatibility.</p><a class="quiet" href="#about.html#faq">Read frequently asked questions →</a></div><button id="chatToggle" aria-label="Open LifeDrop assistant">✉</button></div></div></template><template id="tpl-find-donors.html"><div data-page="find-donors.html"><div class="topline"></div><header><div class="shell head"><a class="brand" href="#index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 56" role="img"><path d="M24 3C18 12 5 27 5 38a19 19 0 0 0 38 0C43 27 30 12 24 3Z" fill="#681326"/><path d="M15 37c0-5 4-11 8-16-1 8-1 14 1 20-5 0-9-1-9-4Z" fill="#fff" opacity=".9"/></svg></span>LifeDrop</a><button class="hamb" id="hamb">Menu</button><nav id="nav"><a class="" href="#index.html">Home</a><a class="active" href="#find-donors.html">Find donors</a><a class="" href="#become-donor.html">Become a donor</a><a class="" href="#request-blood.html">Request blood</a><a class="" href="#about.html">About</a><a href="#admin.html">Demo Admin</a><a class="nav-cta" href="#login.html">Login</a></nav></div></header><main><section class="page-hero"><div class="shell"><div class="crumb">Home / Find donors</div><div class="eyebrow">DONOR DI nsed blood bank.</div></div></footer><div class="assist"><div class="assistant-box hidden" id="chatbox"><b>LifeDrop assistant</b><p>I can explain how to use the platform. I cannot provide medical advice or determine compatibility.</p><a class="quiet" href="#about.html#faq">Read frequently asked questions →</a></div><button id="chatToggle" aria-label="Open LifeDrop assistant">✉</button></div></div></template><template id="tpl-about.html"><div data-page="about.html"><div class="topline"></div><header><div class="shell head"><a class="brand" href="#index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 56" role="img"><path d="M24 3C18 12 5 27 5 38a19 19 0 0 0 38 0C43 27 30 12 24 3Z" fill="#681326"/><path d="M15 37c0-5 4-11 8-16-1 8-1 14 1 20-5 0-9-1-9-4Z" fill="#fff" opacity=".9"/></svg></span>LifeDrop</a><button class="hamb" id="hamb">Menu</button><nav id="nav"><a class="" href="#index.html">Home</a><a class="" href="#find-donors.html">Find donors</a><a class="" href="#become-donor.html">Become a donor</a><a class="" href="#request-blood.html">Request blood</a><a class="active" href="#about.html">About</a><a href="#admin.html">Demo Admin</a><a class="nav-cta" href="#login.html">Login</a></nav></div></header><main><section class="page-hero"><div class="shell"><div class="crumb">Home / About</div><div class="eyebrow">OUR PURPOSE</div><h1>Small acts. Life-changing impact.</h1><p>LifeDrop is a concept for connecting people who are willing to donate blood with people looking for potential donors.</p></div></section><section class="section"><div class="shell grid two"><article class="tile"><div class="iconbox">♡</div><h3>Our mission</h3><p>Make donor discovery easier through a clear, accessible and consent-led experience.</p></article><article class="tile"><div class="iconbox">✦</div><h3>Our values</h3><p>Humanity, privacy, transparency and respect for professional medical guidance.</p></article></div></section><section class="section tint" id="safety"><div class="shell"><div class="section-title"><div class="eyebrow">SAFETY & PRIVACY</div><h2>Trust must come first.</h2></div><div class="grid three"><article class="tile"><h3>Donor consent</h3><p>Personal contact details should only be shared with explicit permission and appropriate controls.</p></article><article class="tile"><h3>Review before listing</h3><p>Production donor profiles should be reviewed before becoming searchable.</p></article><article class="tile"><h3>Medical guidance</h3><p>LifeDrop does not determine eligibility or compatibility. Hospitals and blood banks make clinical decisions.</p></article></div></div></section><section class="section" id="faq"><div class="shell"><div class="section-title"><div class="eyebrow">FAQ</div><h2>Frequently asked questions.</h2></div><div class="panel"><h3>Does a request guarantee blood?</h3><p>No. A request is not a guarantee of availability. Contact the hospital or licensed blood bank for urgent needs.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Can LifeDrop determine blood compatibility?</h3><p>No. Compatibility must be confirmed by qualified medical professionals.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Is this a live donor network?</h3><p>No. This package is a frontend prototype. A real service needs secure backend storage, identity and donor review workflows, consent management and privacy safeguards.</p></div></div></section></main><footer class="footer"><div class="shell"><div class="footgrid"><div><a class="brand" style="color:white" href="#index.html">LifeDrop</a><p>Every Drop Can Save a Life. Connecting people through the spirit of giving.</p></div><div><h3>Explore</h3><a href="#find-donors.html">Find donors</a><a href="#become-donor.html">Become a donor</a><a href="#request-blood.html">Request blood</a></div><div><h3>Information</h3><a href="#about.html">About LifeDrop</a><a href="#about.html#safety">Safety & privacy</a><a href="#about.ht ble in this front-end prototype. It is not protected by real administrator authentication or permissions. Changes are saved only in this browser. Use fictional/sample information only; do not enter real patient or donor details.</div><div id="adminStats" class="grid three admin-section" aria-live="polite"><div class="tile"><span class="micro">Total donor listings</span><h3 id="adminTotalDonors">—</h3></div><div class="tile"><span class="micro">Pending donor reviews</span><h3 id="adminPendingDonors">—</h3></div><div class="tile"><span class="micro">Submitted requests</span><h3 id="adminTotalRequests">—</h3></div></div><div class="panel admin-section"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><span class="pill">DONOR MANAGEMENT</span><h3>Donor listings</h3><p>Approve pending applications or deactivate listings. Sample profiles are already approved for search demonstrations.</p></div><button class="btn secondary" id="resetDemoDonors" type="button">Restore sample donors</button></div><div id="adminDonors" style="margin-top:16px"></div></div><div class="panel admin-section"><span class="pill">REQUEST MANAGEMENT</span><h3>Submitted blood requests</h3><p>Update the simulated status of locally saved demo requests.</p><div id="adminRequests" style="margin-top:16px"></div></div></div></section></main><footer class="footer"><div class="shell"><div class="copyright">LifeDrop admin prototype · Local browser data only · Not a production administration system.</div></div></footer></div></template>

function readData(key, fallback = []) {
  try { const value = JSON.parse(localStorage.getItem('ld_' + key)); return value ?? fallback; }
  catch (_) { return fallback; }
}
function writeData(key, value) {
  try { localStorage.setItem('ld_' + key, JSON.stringify(value)); return true; }
  catch (_) { return false; }
}
function safeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function showMessage(selector, message) { const el = document.querySelector(selector); if (el) el.textContent = message; }
function formValues(form) { return Object.fromEntries(new FormData(form).entries()); }
function ensureDemoDonors(reset=false) {
  const existing = reset ? [] : readData('donors', null);
  const donors = Array.isArray(existing) ? existing : [];
  const ids = new Set(donors.map(d => d.id));
  const merged = [...donors, ...[...DEMO_DONORS, ...WEST_BENGAL_DEMO_DONORS, ...JOKA_NEARBY_DONORS].filter(d => !ids.has(d.id))];
  writeData('donors', merged);
  return merged;
}
function renderDonors() {
  const results = document.querySelector('#results');
  if (!results) return;
  const blood = document.querySelector('#blood')?.value || '';
  const city = (document.querySelector('#city')?.value || '').trim().toLowerCase();
  const locality = (document.querySelector('#locality')?.value || '').trim().toLowerCase();
  const pincode = (document.querySelector('#pincode')?.value || '').trim();
  const all = readData('donors', []).filter(d => d.status === 'Approved');

  // Curated nearby PIN clusters for Kolkata. These are postal-area suggestions,
  // not live distance calculations or a guarantee of donor availability.
  const nearbyPins = {
    '700104':['700104','700063','700082','700060','700034','700061','700008'],
    '700063':['700063','700104','700082','700060','700034','700061','700008'],
    '700082':['700082','700063','700060','700034','700104','700061'],
    '700060':['700060','700034','700082','700063','700104','700061'],
    '700034':['700034','700060','700063','700082','700104','700008','700061'],
    '700061':['700061','700034','700060','700082','700063','700104'],
    '700008':['700008','700034','700060','700063','700104'],
    '700032':['700032','700031','700068','700075','700078','700086'],
    '700064':['700064','700091','700156','700059','700102','700105'],
    '700156':['700156','700064','700091','700102','700059'],
    '700091':['700091','700064','700156','700102','700059'],
    '700028':['700028','700030','700074','700080','700081'],
    '700033':['700033','700034','700041','700045','700053'],
    '700045':['700045','700033','700031','700068','700053']
  };

  const cityMatches = all.filter(d =>
    (!blood || d.blood === blood) &&
    (!city || String(d.city || '').toLowerCase().includes(city))
  );
  let matches = cityMatches.filter(d =>
    (!locality || String(d.locality || '').toLowerCase().includes(locality)) &&
    (!pincode || String(d.pincode || '').includes(pincode))
  );
  let fallbackUsed = false;

  // If an exact PIN search has no matches, show same-city/same-blood profiles
  // in the curated nearby PIN cluster. Locality is treated as the search origin.
  if (!matches.length && pincode.length === 6 && nearbyPins[pincode]) {
    const near = new Set(nearbyPins[pincode]);
    matches = cityMatches.filter(d => near.has(String(d.pincode || '')));
    fallbackUsed = matches.length > 0;
  }

  const summary = document.querySelector('#resultSummary');
  if (summary) {
    summary.textContent = fallbackUsed
      ? `No exact match for PIN ${pincode}. Showing ${matches.length} listings from nearby PIN areas.`
      : `Showing ${matches.length} donor listings.`;
  }
  results.innerHTML = matches.length ? matches.map(d => `<article class="tile donor-card"><div><span class="pill">${safeText(d.blood)}</span></div><h3>${safeText(d.name)}</h3><div class="donor-meta">${safeText(d.locality || 'Area not specified')}, ${safeText(d.city || 'City not specified')} · PIN ${safeText(d.pincode || 'Not provided')}</div><div class="${d.availability === 'Not currently available' ? 'availability off' : 'availability'}">${safeText(d.availability || 'Preference not stated')}</div><div class="donor-actions"><button class="btn primary interest-btn" type="button" data-donor-id="${safeText(d.id)}" ${d.availability === 'Not currently available' ? 'disabled' : ''}>${d.availability === 'Not currently available' ? 'Not currently available' : 'Express interest'}</button><button class="btn secondary request-donor-btn" type="button" data-donor-id="${safeText(d.id)}" ${d.availability === 'Not currently available' ? 'disabled' : ''}>${d.availability === 'Not currently available' ? 'Currently unavailable' : 'Request blood'}</button></div></article>`).join('') : '<div class="empty">No matches found in this PIN area or its configured nearby areas. Try a broader search or another PIN code.</div>';

  results.querySelectorAll('.interest-btn').forEach(button => button.addEventListener('click', () => {
    const donor = readData('donors', []).find(d => d.id === button.dataset.donorId);
    if (!donor) return;
    const interests = readData('interests', []);
    interests.push({id:'IN-' + Date.now().toString().slice(-7),donorId:donor.id,donorName:donor.name,blood:donor.blood,location:[donor.locality,donor.city,donor.pincode].filter(Boolean).join(', '),status:'Interest recorded',createdAt:new Date().toISOString()});
    writeData('interests', interests);
    button.textContent = 'Interest recorded'; button.disabled = true;
    button.insertAdjacentHTML('afterend','<span class="micro">Interest saved. This prototype does not contact the donor.</span>');
  }));
  results.querySelectorAll('.request-donor-btn').forEach(button => button.addEventListener('click', () => {
    const donor = readData('donors', []).find(item => item.id === button.dataset.donorId);
    if (!donor) return;
    location.hash = '#request-blood.html?donor=' + encodeURIComponent(donor.id);
  }));
}

function currentSession() { return readData('session', null); }
function patientProfilesFor(email) {
  return readData('patientProfiles', []).filter(profile => profile.ownerEmail === email);
}
function renderPatientProfiles(session) {
  const list = document.querySelector('#patientProfileList');
  if (!list) return;
  const profiles = patientProfilesFor(session.email);
  list.innerHTML = profiles.length ? profiles.map(profile => `<article class="profile-item"><div><strong>${safeText(profile.name)}</strong><p>${safeText(profile.blood)} · ${safeText(profile.hospital)} · ${safeText(profile.city)} · ${safeText(profile.phone)}</p><p>${safeText(profile.locality || '')} ${safeText(profile.pincode || '')} · ${safeText(profile.units)} unit(s)</p></div><div class="profile-actions"><button class="btn secondary" type="button" data-profile-edit="${safeText(profile.id)}">Edit</button><button class="btn secondary" type="button" data-profile-delete="${safeText(profile.id)}">Delete</button></div></article>`).join('') : '<div class="empty">No patient profiles saved yet. Use the form below to create your first profile.</div>';
  list.querySelectorAll('[data-profile-edit]').forEach(button => button.addEventListener('click', () => {
    const profile = patientProfilesFor(session.email).find(item => item.id === button.dataset.profileEdit);
    const form = document.querySelector('#patientProfileForm');
    if (!profile || !form) return;
    Object.entries(profile).forEach(([key, value]) => { if (form.elements.namedItem(key)) form.elements.namedItem(key).value = value ?? ''; });
    form.elements.namedItem('profileId').value = profile.id;
    document.querySelector('#profileFormTitle').textContent = 'Edit patient profile';
    document.querySelector('#profileFormNote').textContent = 'Update the details and save your changes.';
    form.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  list.querySelectorAll('[data-profile-delete]').forEach(button => button.addEventListener('click', () => {
    if (!confirm('Delete this saved patient profile? Existing requests will remain in your request history.')) return;
    const all = readData('patientProfiles', []);
    writeData('patientProfiles', all.filter(item => !(item.id === button.dataset.profileDelete && item.ownerEmail === session.email)));
    renderPatientProfiles(session);
  }));
}
function populateRequestProfileTools() {
  const tools = document.querySelector('#requestProfileTools');
  if (!tools) return;
  const session = currentSession();
  if (!session) return;
  tools.classList.remove('hidden');
  const select = document.querySelector('#savedProfileSelect');
  const profiles = patientProfilesFor(session.email);
  select.innerHTML = '<option value="">Choose a patient profile</option>' + profiles.map(p => `<option value="${safeText(p.id)}">${safeText(p.name)} — ${safeText(p.blood)}</option>`).join('');
  if (!profiles.length) document.querySelector('#profileFillNote').textContent = 'No saved profiles yet. You can fill this request manually, or create a profile from your dashboard.';
}
function fillRequestFromProfile(profile) {
  const form = document.querySelector('#requestForm');
  if (!form || !profile) return;
  ['name','phone','email','blood','units','hospital','hospitalAddress','city','locality','pincode','date','notes'].forEach(key => {
    if (form.elements.namedItem(key)) form.elements.namedItem(key).value = profile[key] ?? '';
  });
  document.querySelector('#profileFillNote').textContent = 'Profile details filled. Please review and submit.';
}

  const donorBox = document.querySelector('#adminDonors');
  const requestBox = document.querySelector('#adminRequests');
  const allDonors = readData('donors', []);
  const allRequests = readData('requests', []);

  const pendingDonors = document.querySelector('#adminPendingDonors');
  const totalRequests = document.querySelector('#adminTotalRequests');
  if (totalDonors) totalDonors.textContent = allDonors.length;
  if (pendingDonors) pendingDonors.textContent = allDonors.filter(d => (d.status || 'Pending review') === 'Pending review').length;

  if (donorBox) {
    const donors = readData('donors', []);
    donorBox.innerHTML = donors.length ? donors.map(d => `<div class="admin-row"><div><strong>${safeText(d.name)}</strong><div class="micro">${safeText(d.blood)} · ${safeText(d.locality || '')}, ${safeText(d.city || '')} ${safeText(d.pincode || '')}</div></div><div><span class="pill">${safeText(d.status || 'Pending review')}</span>${d.sample ? '<div class="micro">Demo profile</div>' : ''}</div><div class="micro">${safeText(d.availability || 'No preference')}</div><div class="admin-actions">${d.status !== 'Approved' ? `<button class="btn primary" data-action="approve" data-id="${safeText(d.id)}">Approve</button>` : ''}<button class="btn secondary" data-action="deactivate" data-id="${safeText(d.id)}">Deactivate</button></div></div>`).join('') : '<div class="empty">No donor applications yet.</div>';
    donorBox.querySelectorAll('button[data-action]').forEach(button => button.addEventListener('click', () => {
      const list = readData('donors', []); const target = list.find(d => d.id === button.dataset.id); if (!target) return;
      target.status = button.dataset.action === 'approve' ? 'Approved' : 'Deactivated'; writeData('donors', list); renderAdmin();
    }));
  }
  if (requestBox) {
    const requests = readData('requests', []);
    requestBox.innerHTML = requests.length ? requests.map(r => `<div class="admin-row"><div><strong>${safeText(r.id)}</strong><div class="micro">${safeText(r.blood)} · ${safeText(r.locality || '')}, ${safeText(r.city || '')} ${safeText(r.pincode || '')}</div></div><div><span class="pill">${safeText(r.status || 'Submitted')}</span></div><div class="micro">${safeText(r.hospital || 'Hospital not entered')}</div><div class="admin-actions"><button class="btn secondary" data-request-id="${safeText(r.id)}" data-status="In review">In review</button><button class="btn primary" data-request-id="${safeText(r.id)}" data-status="Closed">Close</button></div></div>`).join('') : '<div class="empty">No locally submitted requests yet.</div>';
    requestBox.querySelectorAll('button[data-request-id]').forEach(button => button.addEventListener('click', () => {
      const list = readData('requests', []); const target = list.find(r => r.id === button.dataset.requestId); if (!target) return;
      target.status = button.dataset.status; writeData('requests', list); renderAdmin();
    }));
  }
}
function initPage() {
  const menu = document.querySelector('#hamb'); const nav = document.querySelector('#nav');
  if (menu && nav) menu.addEventListener('click', () => nav.classList.toggle('open'));
  const donorForm = document.querySelector('#donorForm');
  if (donorForm) donorForm.addEventListener('submit', event => {
    event.preventDefault(); const donor = formValues(donorForm);
    donor.id = 'LD-' + Date.now().toString().slice(-8); donor.status = 'Pending review'; donor.sample = false;
    if (!/^\d{6}$/.test(donor.pincode || '')) { showMessage('#donorResult','Please enter a valid 6-digit PIN code.'); return; }
    const donors = readData('donors', []); donors.push(donor); writeData('donors', donors);
    showMessage('#donorResult','Thank you. Your application is saved in this browser and is awaiting admin review. It will not appear in search until approved.'); donorForm.reset();
  });
  const requestForm = document.querySelector('#requestForm');
  if (requestForm) {
    const session = currentSession();
    const hashQuery = location.hash.includes('?') ? location.hash.split('?').slice(1).join('?') : '';
    const params = new URLSearchParams(hashQuery);
    const donorId = params.get('donor') || '';
    const donor = donorId ? readData('donors', []).find(item => item.id === donorId) : null;
    populateRequestProfileTools();
    if (donor) {
      const notice = document.querySelector('#linkedDonorNotice');
      notice.classList.remove('hidden');
      notice.textContent = `This request will be associated with donor ${donor.name} (${donor.blood}) in ${donor.locality}, ${donor.city}. The donor has not been contacted; this prototype only records the association.`;
    }
    document.querySelector('#fillSavedProfile')?.addEventListener('click', () => {
      const profileId = document.querySelector('#savedProfileSelect')?.value;
      const profile = patientProfilesFor(session.email).find(item => item.id === profileId);
      if (!profile) { showMessage('#profileFillNote','Please choose a saved profile first.'); return; }
      fillRequestFromProfile(profile);
    });
    requestForm.addEventListener('submit', event => {
      event.preventDefault(); const request = formValues(requestForm);
      if (!/^\d{6}$/.test(request.pincode || '')) { showMessage('#requestResult','Please enter a valid 6-digit PIN code.'); return; }
      request.id = 'LD-' + Date.now().toString().slice(-7); request.status = 'Submitted';
      request.ownerEmail = session?.email || '';
      request.patientProfileId = document.querySelector('#savedProfileSelect')?.value || '';
      request.donorId = donor?.id || ''; request.donorName = donor?.name || '';
      request.createdAt = new Date().toISOString();
      const requests = readData('requests', []); requests.push(request);
      if (!writeData('requests', requests)) { showMessage('#requestResult','Could not save this request in browser storage.'); return; }
      showMessage('#requestResult','Request saved in this browser. Reference ID: ' + request.id + (donor ? `. Linked donor: ${donor.name}.` : '') + ' This does not contact the donor or guarantee blood availability.');
      requestForm.reset();
      if (document.querySelector('#savedProfileSelect')) document.querySelector('#savedProfileSelect').value = '';
    });
  }
  const searchForm = document.querySelector('#donorSearch');
  if (searchForm) { ensureDemoDonors(); searchForm.addEventListener('submit', event => { event.preventDefault(); renderDonors(); }); renderDonors();
    document.querySelector('#clearSearch')?.addEventListener('click', () => { searchForm.reset(); renderDonors(); });
  }
  const signup = document.querySelector('#signupForm');
  if (signup) signup.addEventListener('submit', event => {
    event.preventDefault(); const user = formValues(signup); const users = readData('users'); user.email = String(user.email || '').toLowerCase();
    if (users.some(existing => existing.email === user.email)) { showMessage('#signupNote','This email is already registered.'); return; }
    users.push(user); writeData('users', users); showMessage('#signupNote','Account created in this browser. You can now log in.'); setTimeout(() => { location.hash = '#login.html'; },700);
  });
  const login = document.querySelector('#loginForm');
  if (login) login.addEventListener('submit', event => {
    event.preventDefault(); const email = (document.querySelector('#email')?.value || '').toLowerCase(); const password = document.querySelector('#password')?.value || '';
    const user = readData('users').find(u => u.email === email && u.password === password);
    if (!user) { showMessage('#loginNote','Email or password is incorrect. Create an account first.'); return; }
    writeData('session',{name:user.name,email:user.email,role:user.role || 'user'}); location.hash = '#dashboard.html';
  });
  const dashboard = document.querySelector('#dashboard');
  if (dashboard) { const session = readData('session',null); if (!session) location.hash = '#login.html'; else {
    const welcome = document.querySelector('#welcome'); if (welcome) welcome.textContent = 'Welcome, ' + session.name;
    const donorStatus = document.querySelector('#donorStatus'); const donorApps = readData('donors').filter(d => d.email === session.email);
    if (donorStatus) donorStatus.textContent = donorApps.length ? 'Application: ' + donorApps[donorApps.length-1].status : 'No donor application yet.';
    const requestStatus = document.querySelector('#requestStatus'); const requests = readData('requests').filter(r => (r.ownerEmail || r.email) === session.email);
    if (requestStatus) requestStatus.textContent = requests.length ? requests.map(r => `${r.id} — ${r.status}${r.donorName ? ' · Donor: ' + r.donorName : ''}`).join(' · ') : 'No requests submitted yet.';
    renderPatientProfiles(session);
    const profileForm = document.querySelector('#patientProfileForm');
    if (profileForm) profileForm.addEventListener('submit', event => {
      event.preventDefault();
      const profile = formValues(profileForm);
      if (!/^\d{6}$/.test(profile.pincode || '')) { showMessage('#profileFormNote','Please enter a valid 6-digit PIN code.'); return; }
      const all = readData('patientProfiles', []);
      const existingIndex = all.findIndex(item => item.id === profile.profileId && item.ownerEmail === session.email);
      profile.id = existingIndex >= 0 ? all[existingIndex].id : 'PT-' + Date.now().toString().slice(-8);
      profile.ownerEmail = session.email;
      if (existingIndex >= 0) all[existingIndex] = profile; else all.push(profile);
      if (!writeData('patientProfiles', all)) { showMessage('#profileFormNote','Could not save this profile in browser storage.'); return; }
      profileForm.reset(); document.querySelector('#profileFormTitle').textContent = 'Add a patient profile';
      showMessage('#profileFormNote','Patient profile saved in this browser.');
      renderPatientProfiles(session);
    });
    document.querySelector('#cancelProfileEdit')?.addEventListener('click', () => {
      profileForm.reset(); document.querySelector('#profileFormTitle').textContent = 'Add a patient profile';
      showMessage('#profileFormNote','Form cleared.');
    });
  }}
  const logout = document.querySelector('#logout'); if (logout) logout.addEventListener('click', () => { localStorage.removeItem('ld_session'); location.hash = '#index.html'; });
  const chat = document.querySelector('#chatToggle'); if (chat) chat.addEventListener('click', () => document.querySelector('#chatbox')?.classList.toggle('hidden'));
  const reset = document.querySelector('#resetDemoDonors'); if (reset) reset.addEventListener('click', () => { const customDonors = readData('donors', []).filter(d => !d.sample); writeData('donors', [...customDonors, ...DEMO_DONORS]); renderAdmin(); });
  if (document.querySelector('#adminDonors')) { ensureDemoDonors(); renderAdmin(); }
}
function route() {
  let page = decodeURIComponent(location.hash.slice(1).split('#')[0].split('?')[0]); if (!pages.includes(page)) page = 'index.html';
  const template = document.getElementById('tpl-' + page);
  if (!template) { app.innerHTML = '<main class="shell section"><h1>Page unavailable</h1><a href="#index.html">Return home</a></main>'; return; }
  app.innerHTML = template.innerHTML; document.title = page.replace('.html','').replace(/-/g,' ') + ' | LifeDrop'; window.scrollTo(0,0); initPage();
}
window.addEventListener('hashchange',route);
if (!location.hash) history.replaceState(null,'','#index.html');
route();
